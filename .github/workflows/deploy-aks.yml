name: Build and deploy to AKS

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: genai-aks-cicd
  NAMESPACE: default
  DEPLOYMENT_NAME: genai-aks-cicd

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set image tag
        id: vars
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry ${{ vars.ACR_NAME }} \
            --image ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }} \
            --image ${{ env.IMAGE_NAME }}:latest \
            .

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}

      - name: Render manifests
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}|" k8s/deployment.yaml

      - name: Deploy to AKS
        run: |
          kubectl apply -n ${{ env.NAMESPACE }} -f k8s/deployment.yaml
          kubectl apply -n ${{ env.NAMESPACE }} -f k8s/service.yaml
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }} --timeout=180s
